name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            command: dist:mac
            artifact: installers-macos
          - name: Windows x64 and ARM64
            os: windows-2022
            command: dist:win
            artifact: installers-windows
          - name: Linux x64 and ARM64
            os: ubuntu-22.04
            command: dist:linux
            artifact: installers-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - name: Test macOS integration
        if: runner.os == 'macOS'
        run: npm run test:mac-signing && npm run test:safari && npm run test:playwright
      - name: Build signed and notarized macOS installers
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/Rinku.app
          spctl --assess --type execute --verbose=2 dist/mac-universal/Rinku.app
          xcrun stapler validate dist/mac-universal/Rinku.app
      - name: Build Windows or Linux installers
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.command }}
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: npm run test:playwright -- --grep 'first run|rows open|quick add'
        env:
          RINKU_TEST_EXECUTABLE: ${{ github.workspace }}/dist/mac-universal/Rinku.app/Contents/MacOS/Rinku
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        run: npm run test:playwright -- --grep 'first run|rows open|quick add'
        env:
          RINKU_TEST_EXECUTABLE: ${{ github.workspace }}/dist/win-unpacked/Rinku.exe
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:playwright -- --grep 'first run|rows open|quick add'
        env:
          RINKU_TEST_EXECUTABLE: ${{ github.workspace }}/dist/linux-unpacked/rinku
      - name: Verify platform assets
        run: npm run release:verify:partial
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  verify:
    name: Verify complete download set
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: rinku-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
